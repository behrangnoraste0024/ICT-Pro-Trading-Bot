services:
  ict_pro_postgres:
    container_name: ict_pro_tradingbot_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ICT_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${ICT_POSTGRES_DB}
      POSTGRES_USER: ${ICT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ICT_POSTGRES_PASSWORD}
    volumes:
      - ict_pro_tradingbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ict_pro_tradingbot_postgres_data:
